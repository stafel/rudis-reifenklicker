# Bonus: Lasttest als Kubernetes-Job direkt im Cluster.
#
# Voraussetzung - die Locust-Datei als ConfigMap anlegen:
#   kubectl -n rudis-reifenklicker create configmap locustfile \
#     --from-file=loadtest/locustfile.py
#   kubectl -n rudis-reifenklicker apply -f loadtest/k8s/locust-job.yaml
#
# Logs ansehen:
#   kubectl -n rudis-reifenklicker logs job/locust-loadtest
apiVersion: batch/v1
kind: Job
metadata:
  name: locust-loadtest
  namespace: rudis-reifenklicker
  labels:
    app: locust
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: locust
    spec:
      restartPolicy: Never
      containers:
        - name: locust
          image: locustio/locust:2.32.5
          args:
            - -f
            - /locust/locustfile.py
            - --host
            - http://backend:8000
            - --headless
            - -u
            - "50"
            - -r
            - "5"
            - -t
            - 2m
            - --only-summary
          volumeMounts:
            - name: locustfile
              mountPath: /locust
      volumes:
        - name: locustfile
          configMap:
            name: locustfile
