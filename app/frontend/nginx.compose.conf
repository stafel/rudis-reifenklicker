# Nur fuer die lokale Entwicklung mit Podman/Docker Compose.
# Der Container-Resolver 127.0.0.11 loest den Service-Namen "backend" auf.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /version.js {
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Der Service-Name "backend" wird beim Start ueber den
        # Container-DNS (Docker wie Podman) aufgeloest.
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
