server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Statische Dateien ausliefern; im Cluster routet das Ingress
    # /api direkt auf den backend-Service.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Version/Pod des Frontends nie cachen, damit das Badge nach einem
    # Rollout sofort den bedienenden Pod zeigt.
    location = /version.js {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}
