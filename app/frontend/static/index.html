<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rudis Reifenklicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">R</span>
      <div class="brand-text">
        <h1>Rudis Autoteile</h1>
        <p>Reifenklicker &middot; Werkstatt-Simulator</p>
      </div>
    </div>
    <div class="season-badge" id="season-badge">Lade&hellip;</div>
  </header>

  <main class="stage">
    <p class="eyebrow">Montierte Reifen</p>
    <div class="counter" id="count">0</div>

    <button class="wheel" id="wheel" aria-label="Reifen montieren">
      <svg class="wheel-svg" viewBox="0 0 200 200" role="img" aria-hidden="true">
        <defs>
          <radialGradient id="tireGrad" cx="50%" cy="42%" r="65%">
            <stop offset="0%" stop-color="#414141"/>
            <stop offset="65%" stop-color="#1b1b1b"/>
            <stop offset="100%" stop-color="#050505"/>
          </radialGradient>
          <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f4f6f8"/>
            <stop offset="45%" stop-color="#b9bec3"/>
            <stop offset="100%" stop-color="#6d7276"/>
          </linearGradient>
          <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fff3b0"/>
            <stop offset="45%" stop-color="#ffd33d"/>
            <stop offset="100%" stop-color="#b8860b"/>
          </linearGradient>
        </defs>

        <circle cx="100" cy="100" r="96" fill="url(#tireGrad)"/>
        <circle cx="100" cy="100" r="88" fill="none" stroke="#2c2c2c" stroke-width="14" stroke-dasharray="7 9"/>
        <circle cx="100" cy="100" r="96" fill="none" stroke="#000" stroke-width="3"/>

        <circle class="rim" cx="100" cy="100" r="60" fill="url(#rimGrad)" stroke="#565b60" stroke-width="2"/>
        <circle cx="100" cy="100" r="54" fill="none" stroke="#8a8f94" stroke-width="1"/>

        <g fill="#d7dbdf" stroke="#83888d" stroke-width="1.5">
          <rect x="94" y="46" width="12" height="54" rx="6" transform="rotate(0 100 100)"/>
          <rect x="94" y="46" width="12" height="54" rx="6" transform="rotate(72 100 100)"/>
          <rect x="94" y="46" width="12" height="54" rx="6" transform="rotate(144 100 100)"/>
          <rect x="94" y="46" width="12" height="54" rx="6" transform="rotate(216 100 100)"/>
          <rect x="94" y="46" width="12" height="54" rx="6" transform="rotate(288 100 100)"/>
        </g>

        <circle cx="100" cy="100" r="20" fill="#e9ebed" stroke="#83888d" stroke-width="2"/>
        <g fill="#8f9499">
          <circle cx="100" cy="86" r="4"/>
          <circle cx="113" cy="96" r="4"/>
          <circle cx="108" cy="111" r="4"/>
          <circle cx="92" cy="111" r="4"/>
          <circle cx="87" cy="96" r="4"/>
        </g>
        <circle cx="100" cy="100" r="6" fill="#c8102e"/>
      </svg>
    </button>

    <p class="hint">Klick auf das Rad, um einen Reifen zu montieren.</p>
    <p class="golden-note" id="golden-note" hidden>Goldfelge! Der nächste Klick gibt Bonus-Reifen.</p>
  </main>

  <footer class="statusbar">
    <span class="status" id="version-badge">&hellip;</span>
    <span class="status" id="pod-badge">&hellip;</span>
    <span class="status" id="golden-flag">Goldfelge: aus</span>
    <span class="status" id="connection-badge">verbunden</span>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
