# Lokale Entwicklungsumgebung (Podman oder Docker Compose).
#
#   podman compose up --build
#   Frontend: http://localhost:8080
#   API:      http://localhost:8000/api/count
#
# Die Datenbank ist nur ein Wegwerf-Volume fuer die lokale Entwicklung.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reifenklicker
      POSTGRES_USER: reifenklicker
      POSTGRES_PASSWORD: werkstatt-passwort
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reifenklicker -d reifenklicker"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./app/backend
      args:
        APP_VERSION: v1
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: reifenklicker
      DB_USER: reifenklicker
      DB_PASSWORD: werkstatt-passwort
      APP_VERSION: v1
      FEATURE_GOLDEN_RIM: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./app/frontend
      args:
        APP_VERSION: v1
    environment:
      POD_NAME: reifen-web
    depends_on:
      - backend
    volumes:
      - ./app/frontend/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  pgdata:
