apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reifenklicker
  namespace: rudis-reifenklicker
  labels:
    app.kubernetes.io/part-of: rudis-reifenklicker
  annotations:
    # HTTP-only im Lab (kein TLS).
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: reifenklicker.local
      http:
        paths:
          # /api geht direkt an das Backend ...
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # ... alles andere an das Frontend.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
