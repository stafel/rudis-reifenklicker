# Optional: Horizontal Pod Autoscaler fuer das Backend.
# Voraussetzung: metrics-server laeuft (im k3s-Cluster standardmaessig aktiv).
# Wird erst interessant, wenn mit Locust Last erzeugt wird.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: rudis-reifenklicker
  labels:
    app: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
