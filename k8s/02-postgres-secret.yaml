apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: rudis-reifenklicker
  labels:
    app: postgres
type: Opaque
# ACHTUNG: Nur fuer die Uebung. In echten Umgebungen niemals Klartext-
# Passwoerter in Git ablegen (siehe SealedSecrets / ExternalSecrets).
stringData:
  POSTGRES_DB: reifenklicker
  POSTGRES_USER: reifenklicker
  POSTGRES_PASSWORD: "werkstatt-passwort"
