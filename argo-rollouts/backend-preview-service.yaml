apiVersion: v1
kind: Service
metadata:
  name: backend-preview
  namespace: rudis-reifenklicker
  labels:
    app: backend
    role: preview
spec:
  # Selektor wird von Argo Rollouts verwaltet (Green-Umgebung).
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
