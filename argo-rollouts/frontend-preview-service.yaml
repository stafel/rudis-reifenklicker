apiVersion: v1
kind: Service
metadata:
  name: frontend-preview
  namespace: rudis-reifenklicker
  labels:
    app: frontend
    role: preview
spec:
  # Selektor wird von Argo Rollouts verwaltet (Green-Umgebung).
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
