# OPTIONAL: Canary-Rollout fuer das Frontend.
#
# Das Haupt-Canary-Beispiel betrifft das Backend (backend-canary-rollout.yaml),
# weil dort die Jahreszeit (Sommer/Winter) sichtbar wird. Analog laesst sich
# auch die statische UI stufenweise ausrollen - das UI-Badge zeigt dann
# gemischt "UI v1"/"UI v2".
#
# Voraussetzung: klassisches Frontend-Deployment loeschen, dann:
#   kubectl -n rudis-reifenklicker delete deployment frontend
#   kubectl -n rudis-reifenklicker apply -f argo-rollouts/frontend-canary-rollout.yaml
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
  namespace: rudis-reifenklicker
  labels:
    app: frontend
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/stafel/rudis-reifenklicker/frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: frontend-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: frontend-config
          configMap:
            name: frontend-config
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: { duration: 60s }
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 75
        - pause: { duration: 60s }
