# Blue/Green fuer das Frontend - Teil einer Umgebungs-weiten
# Blue/Green-Umschaltung (Frontend + Backend zusammen).
#
# Ersetzt das Deployment aus k8s/30-frontend-deployment.yaml. Vor dem
# Anwenden das Deployment loeschen (gleicher Selektor!):
#
#   kubectl -n rudis-reifenklicker delete deployment frontend
#   kubectl -n rudis-reifenklicker apply -f argo-rollouts/frontend-preview-service.yaml
#   kubectl -n rudis-reifenklicker apply -f argo-rollouts/analysis-template.yaml
#   kubectl -n rudis-reifenklicker apply -f argo-rollouts/frontend-bluegreen-rollout.yaml
#
# Umschalten (beide Rollouts, siehe promote-all.sh):
#   kubectl argo rollouts -n rudis-reifenklicker promote frontend
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
  namespace: rudis-reifenklicker
  labels:
    app: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # UI-Version im Image-Tag: v1/v2.
          image: ghcr.io/stafel/rudis-reifenklicker/frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: frontend-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: frontend-config
          configMap:
            name: frontend-config
  strategy:
    blueGreen:
      activeService: frontend
      previewService: frontend-preview
      autoPromotionEnabled: false
      prePromotionAnalysis:
        templates:
          - templateName: frontend-smoke-test
      scaleDownDelaySeconds: 30
