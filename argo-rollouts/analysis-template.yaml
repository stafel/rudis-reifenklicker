# Optionale Smoke-Tests als AnalysisTemplates (ohne Prometheus).
#
# Ein Kubernetes-Job ruft die Green-/Preview-Umgebung auf. Schlaegt der
# Aufruf fehl, bricht das Blue/Green-Rollout automatisch ab.
#
# Werden von den Blue/Green-Rollouts als prePromotionAnalysis verwendet.

apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: backend-smoke-test
  namespace: rudis-reifenklicker
spec:
  args:
    - name: service
      value: backend-preview
  metrics:
    - name: smoke
      count: 1
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: curlimages/curl:8.10.1
                    command:
                      - sh
                      - -c
                      - >-
                        for i in $(seq 1 10); do
                          curl -sf "http://{{args.service}}:8000/api/readyz" && exit 0;
                          sleep 3;
                        done;
                        exit 1
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: frontend-smoke-test
  namespace: rudis-reifenklicker
spec:
  args:
    - name: service
      value: frontend-preview
  metrics:
    - name: smoke
      count: 1
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: curlimages/curl:8.10.1
                    command:
                      - sh
                      - -c
                      - >-
                        for i in $(seq 1 10); do
                          curl -sf "http://{{args.service}}/healthz" && exit 0;
                          sleep 3;
                        done;
                        exit 1
