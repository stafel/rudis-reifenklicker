apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rudis-reifenklicker
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: rudis-reifenklicker
  source:
    repoURL: https://github.com/stafel/rudis-reifenklicker.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: rudis-reifenklicker
  # Default: manueller Sync (kein Self-Heal/Prune).
  # Sync-Policy und ignoreDifferences werden im Arbeitsblatt konfiguriert.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
